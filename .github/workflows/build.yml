name: CI

# Pull requests and pushes to master run CI only. Releases come from the
# nightly build (once a day, only when master changed since the last release)
# and from annotated v* tags (a deliberate version bump).
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  schedule:
    # 06:17 UTC daily (off the hour, where scheduled runs queue up).
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: "Publish a nightly release of master now (skipped if master is unchanged)"
        type: boolean
        default: false

# Cancel superseded runs of a pull request. Everything else runs to completion
# (a group of its own), since nightly and tag runs publish a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Decides whether this run builds at all and, for a nightly, its release
  # number: today's UTC date (YYYYMMDD), so each nightly's package version
  # (e.g. 1.7.0-r20260930) is higher than the last and apk upgrades to it.
  changes:
    name: Decide what to run
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      nightly: ${{ steps.decide.outputs.nightly }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.nightly }}
        run: |
          if [ "$EVENT" != schedule ] && [ "$FORCE" != true ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_REF" != refs/heads/master ]; then
            echo "::error::nightly releases are built from master only" >&2
            exit 1
          fi
          # Skip when the latest release already points at master's head.
          last=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null) || last=
          last_sha=
          if [ -n "$last" ]; then
            last_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$last" --jq .sha 2>/dev/null) || last_sha=
          fi
          if [ -n "$last_sha" ] && [ "$last_sha" = "$GITHUB_SHA" ]; then
            echo "master is unchanged since $last; no nightly release"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "nightly=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

  static:
    name: Static checks (shell / JSON / whitespace)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: sh -n on shell scripts
        run: |
          for f in \
            nordvpn-wireguard/files/etc/init.d/nordvpn \
            nordvpn-wireguard/files/etc/uci-defaults/90-nordvpn-migrate \
            nordvpn-wireguard/tests/run.sh; do
            echo "sh -n $f"; sh -n "$f"
          done
      - name: Validate all JSON
        run: |
          fail=0
          for f in $(find . -path ./node_modules -prune -o -name '*.json' -print); do
            echo "jq $f"; jq -e . "$f" >/dev/null || fail=1
          done
          exit $fail
      - name: Whitespace / conflict markers
        run: git diff --check "$(git hash-object -t tree /dev/null)"

  eslint:
    name: ESLint (LuCI JS view)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install --no-save --no-audit --no-fund --legacy-peer-deps eslint@9 @eslint/js@9 globals@15
      - run: npx eslint luci-app-nordvpn

  ucode:
    name: ucode syntax + offline tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Build a minimal ucode (core + fs + math)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc build-essential libjson-c-dev git
          git clone --depth 1 https://github.com/jow-/ucode.git /tmp/ucode
          cd /tmp/ucode
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DFS_SUPPORT=ON -DMATH_SUPPORT=ON -DSTRUCT_SUPPORT=OFF \
            -DUBUS_SUPPORT=OFF -DUCI_SUPPORT=OFF -DULOOP_SUPPORT=OFF \
            -DRTNL_SUPPORT=OFF -DNL80211_SUPPORT=OFF -DRESOLV_SUPPORT=OFF \
            -DDEBUG_SUPPORT=OFF -DLOG_SUPPORT=OFF
          cmake --build build -j"$(nproc)"
      - name: Compile-check standalone ucode programs
        run: |
          UC=/tmp/ucode/build/ucode
          LIB="$PWD/nordvpn-wireguard/files/usr/share/ucode"
          MOCKS="$PWD/nordvpn-wireguard/tests/mocks"
          B=/tmp/ucode/build
          for f in \
            nordvpn-wireguard/files/usr/share/rpcd/ucode/nordvpn.uc \
            nordvpn-wireguard/files/usr/bin/nordvpn-cache-update \
            nordvpn-wireguard/files/usr/bin/nordvpn-cache-query \
            nordvpn-wireguard/files/usr/bin/nordvpn-apply \
            nordvpn-wireguard/files/usr/bin/nordvpn-rotate; do
            echo "ucode -c $f"
            "$UC" -L "$MOCKS/*.uc" -L "$LIB/*.uc" -L "$B/*.so" -c "$f"
          done
      - name: Run offline fixture/unit tests (modules compiled by import)
        run: |
          UCODE=/tmp/ucode/build/ucode \
          UCODE_EXTRA_L="/tmp/ucode/build/*.so" \
            sh nordvpn-wireguard/tests/run.sh

  build-backend:
    name: Build packages (snapshot SDK, apk)
    # GitHub-hosted for every event: this fork has no self-hosted runner.
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Prepare host tools and the SDK working dir
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget jq curl ca-certificates \
            gcc-multilib g++-multilib
          # Persistent cache dir on the self-hosted runner (mounted volume);
          # the ephemeral workspace on GitHub-hosted runners.
          if [ -d /sdkcache ] && [ -w /sdkcache ]; then ROOT=/sdkcache; else ROOT="$GITHUB_WORKSPACE/.sdk"; mkdir -p "$ROOT"; fi
          BASE=https://downloads.openwrt.org/snapshots/targets/x86/64
          SUMS=$(curl -fsSL --http1.1 --retry 5 --retry-all-errors "$BASE/sha256sums")
          SDK=$(printf '%s\n' "$SUMS" | grep -o 'openwrt-sdk-[^ ]*x86-64[^ ]*\.tar\.zst' | head -1)
          SDKDIR="$ROOT/${SDK%.tar.zst}"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          echo "SDKDIR=$SDKDIR" >> "$GITHUB_ENV"
          if [ -x "$SDKDIR/scripts/feeds" ]; then
            echo "Reusing warm SDK: $SDKDIR"
          else
            echo "Fetching SDK: $SDK"
            # The mirror cuts long transfers off mid-way (curl error 92 on
            # HTTP/2, 18 on HTTP/1.1) every minute or two, at ~100 KB/s on a
            # bad day, so a 284 MB download restarted from zero never gets
            # through: resume over HTTP/1.1 for as long as attempts make
            # progress (within a deadline), until the file matches the
            # published checksum. A transfer that goes silent is cut after a
            # minute instead of hanging until the job's timeout. The partial
            # file is named after the SDK, so a leftover from an older
            # snapshot (warm runner) is never resumed, and one of this
            # snapshot is kept on failure for the next run to resume.
            PART="$ROOT/$SDK.part"
            find "$ROOT" -maxdepth 1 -name 'openwrt-sdk-*.part' ! -name "$SDK.part" -delete
            SUM=$(printf '%s\n' "$SUMS" | grep -F "$SDK" | awk '{ print $1 }' | head -1 || true)
            deadline=$(( $(date +%s) + 100 * 60 ))
            ok=0; i=0; idle=0
            while :; do
              i=$((i + 1))
              before=$(stat -c %s "$PART" 2>/dev/null || echo 0)
              rc=0
              curl -fsSL --http1.1 --connect-timeout 30 --speed-limit 1024 --speed-time 60 \
                -C - -o "$PART" "$BASE/$SDK" || rc=$?
              if [ -n "$SUM" ]; then
                if printf '%s  %s\n' "$SUM" "$PART" | sha256sum -c --status -; then ok=1; break; fi
                # Complete by curl's account yet wrong: the partial file it
                # resumed was bad. Start over from the first byte.
                if [ "$rc" = 0 ]; then : > "$PART"; fi
              elif [ "$rc" = 0 ]; then
                ok=1; break
              fi
              after=$(stat -c %s "$PART" 2>/dev/null || echo 0)
              if [ "$after" -gt "$before" ]; then idle=0; else idle=$((idle + 1)); fi
              echo "SDK download attempt $i: $after bytes so far (curl exit $rc)"
              if [ "$idle" -ge 5 ] || [ "$(date +%s)" -ge "$deadline" ]; then break; fi
              sleep 15
            done
            if [ "$ok" != 1 ]; then
              echo "::error::could not download $SDK ($i attempts)"
              exit 1
            fi
            echo "SDK downloaded in $i attempt(s)"
            tar -I zstd -xf "$PART" -C "$ROOT"
            rm -f "$PART"
          fi

      # GitHub-hosted runners have no warm disk, so the SDK state lives in
      # the Actions cache. dl/ is content-addressed (prefix restore-key survives snapshot bumps);
      # toolchain state is exact-key only so a bump never mixes toolchains.
      - name: Cache downloaded sources (dl)
        uses: actions/cache@v4
        with:
          path: ${{ env.SDKDIR }}/dl
          key: openwrt-dl-${{ env.SDK }}
          restore-keys: |
            openwrt-dl-
      - name: Cache build state (feeds, staging_dir, build_dir)
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.SDKDIR }}/feeds
            ${{ env.SDKDIR }}/staging_dir
            ${{ env.SDKDIR }}/build_dir
            ${{ env.SDKDIR }}/tmp
          key: openwrt-build-${{ env.SDK }}

      - name: Build both packages
        env:
          NIGHTLY: ${{ needs.changes.outputs.nightly }}
        run: |
          cd "$SDKDIR"
          # Drop any package built by a previous run so the artifact glob only
          # picks up freshly built .apk files (warm SDK keeps old ones around).
          rm -f bin/packages/*/*/*nordvpn*.apk 2>/dev/null || true
          # Fetch the feeds from OpenWrt's official GitHub mirrors (same
          # commits): git.openwrt.org intermittently answers HTTP 500, notably
          # to the full clone a new snapshot's base-feed pin triggers. Pinned
          # ^commit / ;branch suffixes are kept.
          sed -i \
            -e 's#https://git\.openwrt\.org/openwrt/openwrt\.git#https://github.com/openwrt/openwrt.git#' \
            -e 's#https://git\.openwrt\.org/feed/\([a-z0-9_-]*\)\.git#https://github.com/openwrt/\1.git#' \
            -e 's#https://git\.openwrt\.org/project/luci\.git#https://github.com/openwrt/luci.git#' \
            feeds.conf.default
          grep '^src-' feeds.conf.default
          # Install every feed: luci-app-nordvpn pulls luci-base -> lucihttp,
          # whose Lua binding needs headers a narrowed install does not provide.
          # Retry transient fetch errors; `if` keeps bash -e from exiting early.
          ok=0
          for delay in 0 30 60; do
            sleep "$delay"
            if ./scripts/feeds update -a; then ok=1; break; fi
            echo "feeds update failed; retrying" >&2
          done
          if [ "$ok" != 1 ]; then echo "::error::feeds update failed 3 times" >&2; exit 1; fi
          rm -rf package/nordvpn-wireguard
          cp -r "$GITHUB_WORKSPACE/nordvpn-wireguard" package/nordvpn-wireguard
          rm -rf feeds/luci/applications/luci-app-nordvpn
          cp -r "$GITHUB_WORKSPACE/luci-app-nordvpn" feeds/luci/applications/luci-app-nordvpn
          # A nightly's release number is the date (in the copies only; the
          # repository keeps PKG_RELEASE:=1 for tagged releases).
          if [ -n "$NIGHTLY" ]; then
            sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=$NIGHTLY/" \
              package/nordvpn-wireguard/Makefile feeds/luci/applications/luci-app-nordvpn/Makefile
            grep -H '^PKG_\(VERSION\|RELEASE\):=' \
              package/nordvpn-wireguard/Makefile feeds/luci/applications/luci-app-nordvpn/Makefile
          fi
          # Reindex the luci feed (-i, no fetch) so the just-copied app is
          # registered; feeds install reads the index, so without this the
          # compile target does not exist.
          ./scripts/feeds update -i luci
          ./scripts/feeds install -a
          make defconfig
          make package/nordvpn-wireguard/compile package/luci-app-nordvpn/compile V=s
      - uses: actions/upload-artifact@v4
        with:
          name: nordvpn-packages
          path: ${{ env.SDKDIR }}/bin/packages/*/*/*nordvpn*.apk
          if-no-files-found: warn

  # A nightly publishes v<PKG_VERSION>-r<YYYYMMDD> with notes generated from
  # the changes merged since the previous release. Pushing an annotated v*
  # tag publishes a hand-written release.
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [changes, static, eslint, ucode, build-backend]
    if: needs.changes.outputs.nightly != '' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nordvpn-packages
          path: dist
      - name: Create the nightly release
        if: needs.changes.outputs.nightly != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY: ${{ needs.changes.outputs.nightly }}
        run: |
          files=$(find dist -name '*.apk')
          if [ -z "$files" ]; then echo "::error::no packages were built" >&2; exit 1; fi
          echo "$files"
          ver=$(sed -n 's/^PKG_VERSION:=//p' nordvpn-wireguard/Makefile)
          case "$ver" in
            ''|*[!0-9.]*) echo "::error::cannot read PKG_VERSION from nordvpn-wireguard/Makefile" >&2; exit 1 ;;
          esac
          tag="v$ver-r$NIGHTLY"
          # Mark it latest only while this commit is still master's head, so
          # a slower run for an older commit cannot take "latest" back.
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha) || head=$GITHUB_SHA
          if [ "$head" = "$GITHUB_SHA" ]; then latest=true; else latest=false; fi
          if gh release view "$tag" >/dev/null 2>&1; then
            # A re-run of the same commit refreshes the packages. Today's
            # nightly for another commit would ship different code under the
            # same version, which apk would never upgrade to.
            tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "::error::$tag was already published today for $tag_sha; the next nightly picks up $GITHUB_SHA" >&2
              exit 1
            fi
            gh release upload "$tag" $files --clobber
          else
            # Tags created with the workflow token trigger no further runs.
            gh release create "$tag" $files --target "$GITHUB_SHA" \
              --title "$tag" --generate-notes --latest="$latest"
          fi
      - name: Create the release for an annotated tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -name '*.apk'
          # The annotated tag body is the release notes. Read it from the
          # API: the checkout above is shallow and has no tag object, so
          # --notes-from-tag would silently fall back to the commit message.
          obj=$(gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$GITHUB_REF_NAME" \
            --jq '.object.sha + " " + .object.type')
          sha=${obj%% *}
          if [ "${obj##* }" != "tag" ]; then
            echo "::error::$GITHUB_REF_NAME is a lightweight tag. Re-create it annotated (git tag -a $GITHUB_REF_NAME -m ...) and push it before releasing." >&2
            exit 1
          fi
          # Drop the annotation's first line (GitHub already shows it as the
          # release title) and the blank lines that leaves at the top.
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .message | tail -n +2 | sed '/./,$!d' > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::$GITHUB_REF_NAME has an empty annotation body; write the release notes into the tag message." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" $(find dist -name '*.apk') \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
